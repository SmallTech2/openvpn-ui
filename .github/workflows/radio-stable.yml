name: OpenVPN UI - Publish stable release

# Publication uniquement lors de la creation explicite du tag definitif.
on: create

permissions:
  contents: read

jobs:
  publish:
    if: github.event.ref_type == 'tag' && github.event.ref == 'radio-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout frozen deployment sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/radio-v1
          fetch-depth: 0
          persist-credentials: false
      - name: Reuse exact validated binary without compilation
        env:
          BINARY_COMMIT: 684151fb3a0ad27e392f79e617cb649583c4e8ff
          VALIDATED_DEPLOYMENT_COMMIT: db5b79d24ceb57eeee864e3ec15783ffba51fc91
        run: |
          set -euo pipefail
          for script in Radio/*.sh Radio/scripts/*.sh; do bash -n "$script"; done
          git diff --exit-code "$BINARY_COMMIT" HEAD -- '*.go' go.mod go.sum vendor static views swagger
          curl --fail --location --proto '=https' --proto-redir '=https' \
            https://github.com/SmallTech2/openvpn-ui/releases/download/radio-build-test3/radio-openvpn-ui-linux-amd64.zip \
            -o "$RUNNER_TEMP/validated.zip"
          echo "5acdc81bed60627e86d1f2a24afea4178ab74c0780db1e6eb5507aece3ab1431  $RUNNER_TEMP/validated.zip" | sha256sum -c -
          mkdir "$RUNNER_TEMP/validated"
          unzip -q "$RUNNER_TEMP/validated.zip" -d "$RUNNER_TEMP/validated"
          (cd "$RUNNER_TEMP/validated"; sha256sum -c SHA256SUMS)
          [[ "$(cat "$RUNNER_TEMP/validated/source-commit.txt")" == "$BINARY_COMMIT" ]]
          echo "5e5255d176839be76df6d08fd373dd62fc915fd86bb2ffb90ad9bfe34d8b53b8  $RUNNER_TEMP/validated/openvpn-ui" | sha256sum -c -
          BINARY_SOURCE_COMMIT="$BINARY_COMMIT" bash Radio/package-release.sh "$RUNNER_TEMP/validated/openvpn-ui"
          cp "$RUNNER_TEMP/validated/openvpn-ui" dist/openvpn-ui
          (cd dist; sha256sum openvpn-ui > openvpn-ui.sha256)
          printf '%s\n' "$BINARY_COMMIT" > dist/source-commit.txt
          git rev-parse HEAD > dist/deployment-source-commit.txt
          printf '%s\n' "$VALIDATED_DEPLOYMENT_COMMIT" > dist/validated-deployment-commit.txt
          (cd dist; sha256sum -c radio-openvpn-ui-linux-amd64.zip.sha256)
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create radio-v1 --verify-tag --latest \
            --title 'Radio Bonheur - radio-v1' --notes-file Radio/RELEASE-radio-v1.md \
            dist/radio-openvpn-ui-linux-amd64.zip dist/radio-openvpn-ui-linux-amd64.zip.sha256 \
            dist/openvpn-ui dist/openvpn-ui.sha256 \
            dist/source-commit.txt dist/deployment-source-commit.txt dist/validated-deployment-commit.txt

  publish_radio_v2:
    if: github.event.ref_type == 'tag' && github.event.ref == 'radio-v2.2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout exact stable tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/radio-v2.2
          persist-credentials: false
      - name: Retrieve successful build of this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SOURCE_COMMIT=$(git rev-parse HEAD)
          [[ "$SOURCE_COMMIT" == "$GITHUB_SHA" ]]
          RUN_ID=$(gh api "repos/$GH_REPO/actions/workflows/radio-build.yml/runs?head_sha=$SOURCE_COMMIT&event=push&status=success&per_page=5" --jq '.workflow_runs[0].id')
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Aucune compilation validee pour ce commit exact.' >&2; exit 1; }
          gh run download "$RUN_ID" --repo "$GH_REPO" --name radio-openvpn-ui-linux-amd64 --dir dist
          [[ "$(cat dist/source-commit.txt)" == "$SOURCE_COMMIT" ]]
          [[ "$(cat dist/deployment-source-commit.txt)" == "$SOURCE_COMMIT" ]]
          (cd dist; sha256sum -c openvpn-ui.sha256; sha256sum -c radio-openvpn-ui-linux-amd64.zip.sha256)
          mkdir "$RUNNER_TEMP/radio-v2.2"
          unzip -q dist/radio-openvpn-ui-linux-amd64.zip -d "$RUNNER_TEMP/radio-v2.2"
          (cd "$RUNNER_TEMP/radio-v2.2"; sha256sum -c SHA256SUMS)
          cmp dist/openvpn-ui "$RUNNER_TEMP/radio-v2.2/openvpn-ui"
          python3 - "$SOURCE_COMMIT" <<'PY'
          import pathlib, subprocess, sys, zipfile
          commit = sys.argv[1]
          with zipfile.ZipFile('dist/radio-openvpn-ui-linux-amd64.zip') as archive:
              for name in ('source-commit.txt', 'deployment-source-commit.txt'):
                  assert archive.read(name).decode().strip() == commit
              assert ('vcs.revision=' + commit).encode() in archive.read('openvpn-ui')
              names = subprocess.check_output(['git', 'ls-files', 'Radio', 'docs', 'README.md', 'LICENSE', 'static', 'views', 'swagger']).decode().splitlines()
              for name in names:
                  assert archive.read(name) == pathlib.Path(name).read_bytes(), name
          PY
          printf 'Compilation et tests : https://github.com/%s/actions/runs/%s\n' "$GH_REPO" "$RUN_ID" > "$RUNNER_TEMP/radio-v2.2-notes.md"
          printf '\nCommit : %s\n\nCertificats revoques masques, compte Linux configurable, validation automatique d une nouvelle connexion SSH par cle sans recopie, clavier console applique avec setupcon --force, email PKI demande sans adresse reelle par defaut et documentation dans docs/.\n\nFiltrage nftables conserve. Recette complete sur Debian 13 vierge restant a effectuer pour valider definitivement cette installation.\n' "$SOURCE_COMMIT" >> "$RUNNER_TEMP/radio-v2.2-notes.md"
      - name: Publish radio-v2.2 from verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create radio-v2.2 --verify-tag --latest --target "$GITHUB_SHA" \
            --title 'OpenVPN UI - radio-v2.2' --notes-file "$RUNNER_TEMP/radio-v2.2-notes.md" \
            dist/radio-openvpn-ui-linux-amd64.zip dist/radio-openvpn-ui-linux-amd64.zip.sha256 \
            dist/openvpn-ui dist/openvpn-ui.sha256 dist/source-commit.txt dist/deployment-source-commit.txt
